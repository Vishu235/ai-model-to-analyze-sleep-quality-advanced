<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sleep Staging AI</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0f1117;
      color: #e2e8f0;
      min-height: 100vh;
    }

    header {
      background: #1a1d2e;
      border-bottom: 1px solid #2d3748;
      padding: 20px 40px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    header h1 { font-size: 1.4rem; font-weight: 600; color: #a78bfa; }
    header span { font-size: 0.85rem; color: #64748b; }

    .container { max-width: 1100px; margin: 0 auto; padding: 40px 20px; }

    /* Upload card */
    .upload-card {
      background: #1a1d2e;
      border: 1px solid #2d3748;
      border-radius: 12px;
      padding: 32px;
      margin-bottom: 32px;
      text-align: center;
    }
    .upload-card h2 { font-size: 1.1rem; color: #94a3b8; margin-bottom: 20px; }

    .drop-zone {
      border: 2px dashed #4a5568;
      border-radius: 10px;
      padding: 48px 20px;
      cursor: pointer;
      transition: all 0.2s;
      position: relative;
    }
    .drop-zone:hover, .drop-zone.dragover {
      border-color: #a78bfa;
      background: rgba(167,139,250,0.05);
    }
    .drop-zone input[type="file"] {
      position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%;
    }
    .drop-zone .icon { font-size: 2.5rem; margin-bottom: 12px; }
    .drop-zone p { color: #64748b; font-size: 0.95rem; }
    .drop-zone p span { color: #a78bfa; font-weight: 600; }
    .file-name { margin-top: 12px; color: #a78bfa; font-size: 0.9rem; min-height: 20px; }

    .channel-row {
      display: flex; align-items: center; gap: 12px;
      justify-content: center; margin-top: 20px;
    }
    .channel-row label { color: #94a3b8; font-size: 0.9rem; }
    .channel-row input {
      background: #0f1117; border: 1px solid #2d3748;
      color: #e2e8f0; border-radius: 6px; padding: 8px 12px;
      font-size: 0.9rem; width: 200px;
    }

    .btn {
      margin-top: 24px;
      background: #7c3aed;
      color: white;
      border: none;
      padding: 12px 36px;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn:hover { background: #6d28d9; }
    .btn:disabled { background: #4a5568; cursor: not-allowed; }

    /* Loading */
    .loading {
      display: none;
      text-align: center;
      padding: 20px;
      color: #94a3b8;
    }
    .spinner {
      width: 36px; height: 36px;
      border: 3px solid #2d3748;
      border-top-color: #a78bfa;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 12px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Error */
    .error-box {
      display: none;
      background: #2d1b1b;
      border: 1px solid #7f1d1d;
      border-radius: 8px;
      padding: 14px 18px;
      color: #fca5a5;
      margin-top: 16px;
      font-size: 0.9rem;
    }

    /* Results */
    #results { display: none; }

    /* AI Explanation */
    .explain-card {
      background: #1a1d2e;
      border: 1px solid #2d3748;
      border-radius: 12px;
      padding: 24px;
      margin-top: 24px;
    }
    .explain-card h3 { font-size: 1rem; color: #94a3b8; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
    .explain-card .badge { font-size: 0.7rem; padding: 2px 8px; border-radius: 20px; background: #7c3aed22; color: #a78bfa; border: 1px solid #7c3aed44; }
    .explain-text { color: #cbd5e1; font-size: 0.95rem; line-height: 1.7; margin-bottom: 16px; }
    .tips-list { list-style: none; display: flex; flex-direction: column; gap: 8px; }
    .tips-list li { background: #0f1117; border-left: 3px solid #a78bfa; padding: 10px 14px; border-radius: 0 6px 6px 0; font-size: 0.88rem; color: #94a3b8; }
    .explain-loading { color: #64748b; font-size: 0.9rem; display: flex; align-items: center; gap: 10px; }
    .explain-loading .spinner { width: 18px; height: 18px; border-width: 2px; margin: 0; }

    /* Score */
    .score-row {
      display: grid;
      grid-template-columns: 1fr 2fr;
      gap: 20px;
      margin-bottom: 24px;
    }
    .score-card {
      background: #1a1d2e;
      border: 1px solid #2d3748;
      border-radius: 12px;
      padding: 28px;
      text-align: center;
    }
    .score-card .label { font-size: 0.85rem; color: #64748b; margin-bottom: 10px; }
    .score-card .score {
      font-size: 3.5rem;
      font-weight: 700;
      line-height: 1;
    }
    .score-card .suffix { font-size: 1.2rem; color: #64748b; }

    /* Metrics grid */
    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }
    .metric-card {
      background: #1a1d2e;
      border: 1px solid #2d3748;
      border-radius: 10px;
      padding: 18px;
    }
    .metric-card .m-label { font-size: 0.78rem; color: #64748b; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 6px; }
    .metric-card .m-value { font-size: 1.5rem; font-weight: 700; color: #e2e8f0; }
    .metric-card .m-unit  { font-size: 0.8rem; color: #64748b; }

    /* Hypnogram */
    .chart-card {
      background: #1a1d2e;
      border: 1px solid #2d3748;
      border-radius: 12px;
      padding: 24px;
      margin-top: 24px;
    }
    .chart-card h3 { font-size: 1rem; color: #94a3b8; margin-bottom: 20px; }
    .chart-wrap { position: relative; height: 220px; }

    /* Stage legend */
    .legend {
      display: flex; gap: 16px; flex-wrap: wrap;
      margin-top: 14px;
    }
    .legend-item { display: flex; align-items: center; gap: 6px; font-size: 0.82rem; color: #94a3b8; }
    .legend-dot { width: 10px; height: 10px; border-radius: 2px; }

    /* Score colors */
    .score-poor   { color: #f87171; }
    .score-fair   { color: #fbbf24; }
    .score-good   { color: #34d399; }
    .score-great  { color: #818cf8; }

    @media (max-width: 640px) {
      .score-row { grid-template-columns: 1fr; }
      .metrics-grid { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
</head>
<body>

<header>
  <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#a78bfa" stroke-width="2">
    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2z"/>
    <path d="M12 6v6l4 2"/>
  </svg>
  <h1>Sleep Staging AI</h1>
  <span>CNN + LSTM · EEG Analysis</span>
</header>

<div class="container">

  <!-- Upload -->
  <div class="upload-card">
    <h2>Upload EDF File</h2>

    <div class="drop-zone" id="dropZone">
      <input type="file" id="fileInput" accept=".edf" />
      <div class="icon">📂</div>
      <p>Drag & drop your <span>.edf</span> file here, or <span>browse</span></p>
    </div>
    <div class="file-name" id="fileName"></div>

    <div class="channel-row">
      <label>EEG Channel:</label>
      <input type="text" id="channelInput" value="EEG Fpz-Cz" placeholder="e.g. EEG Fpz-Cz" />
    </div>

    <div class="channel-row">
      <label>API Key:</label>
      <input type="password" id="apiKeyInput" placeholder="Leave blank if not set" />
    </div>

    <div class="channel-row">
      <label>Explanation Language:</label>
      <select id="langInput" style="background:#0f1117;border:1px solid #2d3748;color:#e2e8f0;border-radius:6px;padding:8px 12px;font-size:0.9rem;width:200px;">
        <option value="english">English</option>
        <option value="hindi">Hindi</option>
      </select>
    </div>

    <button class="btn" id="analyzeBtn" onclick="analyze()" disabled>Analyze Sleep</button>

    <div class="error-box" id="errorBox"></div>
  </div>

  <!-- Loading -->
  <div class="loading" id="loading">
    <div class="spinner"></div>
    <p id="loadingMsg">Uploading EDF file…</p>
  </div>

  <!-- Results -->
  <div id="results">

    <div class="score-row">
      <!-- Sleep Quality Score -->
      <div class="score-card">
        <div class="label">Sleep Quality Score</div>
        <div class="score" id="scoreVal">—</div>
        <div class="suffix">/ 100</div>
      </div>

      <!-- Metrics -->
      <div class="metrics-grid" id="metricsGrid"></div>
    </div>

    <!-- AI Explanation -->
    <div class="explain-card" id="explainCard">
      <h3>
        AI Sleep Analysis
        <span class="badge" id="explainBadge">Claude AI</span>
      </h3>
      <div id="explainBody">
        <div class="explain-loading">
          <div class="spinner"></div>
          Generating personalized analysis…
        </div>
      </div>
    </div>

    <!-- Hypnogram -->
    <div class="chart-card">
      <h3>Hypnogram</h3>
      <div class="chart-wrap">
        <canvas id="hypnoChart"></canvas>
      </div>
      <div class="legend">
        <div class="legend-item"><div class="legend-dot" style="background:#f87171"></div>Wake</div>
        <div class="legend-item"><div class="legend-dot" style="background:#fb923c"></div>N1</div>
        <div class="legend-item"><div class="legend-dot" style="background:#facc15"></div>N2</div>
        <div class="legend-item"><div class="legend-dot" style="background:#34d399"></div>N3</div>
        <div class="legend-item"><div class="legend-dot" style="background:#818cf8"></div>REM</div>
      </div>
    </div>

  </div>
</div>

<script>
  const STAGE_COLORS = ['#f87171','#fb923c','#facc15','#34d399','#818cf8'];
  const STAGE_LABELS = ['Wake','N1','N2','N3','REM'];
  let hypnoChart = null;

  // File drag & drop
  const dropZone = document.getElementById('dropZone');
  const fileInput = document.getElementById('fileInput');

  dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('dragover'); });
  dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
  dropZone.addEventListener('drop', e => {
    e.preventDefault();
    dropZone.classList.remove('dragover');
    if (e.dataTransfer.files[0]) setFile(e.dataTransfer.files[0]);
  });
  fileInput.addEventListener('change', () => { if (fileInput.files[0]) setFile(fileInput.files[0]); });

  function setFile(f) {
    document.getElementById('fileName').textContent = f.name;
    document.getElementById('analyzeBtn').disabled = false;
  }

  async function analyze() {
    const file = fileInput.files[0];
    if (!file) return;

    const channel = document.getElementById('channelInput').value.trim() || 'EEG Fpz-Cz';
    const apiKey  = document.getElementById('apiKeyInput').value.trim();
    const headers = apiKey ? { 'X-API-Key': apiKey } : {};

    document.getElementById('errorBox').style.display = 'none';
    document.getElementById('results').style.display = 'none';
    document.getElementById('loading').style.display = 'block';
    document.getElementById('loadingMsg').textContent = 'Uploading EDF file…';
    document.getElementById('analyzeBtn').disabled = true;

    try {
      // Step 1: submit job
      const fd = new FormData();
      fd.append('file', file);
      fd.append('channel', channel);
      fd.append('smooth', 'true');

      const submitResp = await fetch('/predict/edf', { method: 'POST', body: fd, headers });
      let submitData;
      try { submitData = await submitResp.json(); } catch { submitData = {}; }
      if (!submitResp.ok) {
        const detail = submitData.detail
          ? (typeof submitData.detail === 'string' ? submitData.detail : JSON.stringify(submitData.detail))
          : `HTTP ${submitResp.status} — ${submitResp.statusText}`;
        throw new Error(detail);
      }

      const jobId = submitData.job_id;
      document.getElementById('loadingMsg').textContent = 'Analyzing EEG signal… this may take a few minutes';

      // Step 2: poll for result
      const data = await pollJob(jobId, headers);
      renderResults(data);
      fetchExplanation(data.metrics);
    } catch (err) {
      const box = document.getElementById('errorBox');
      box.textContent = '❌ ' + err.message;
      box.style.display = 'block';
    } finally {
      document.getElementById('loading').style.display = 'none';
      document.getElementById('analyzeBtn').disabled = false;
    }
  }

  async function pollJob(jobId, headers) {
    let elapsed = 0;
    while (elapsed < 1800) {   // max 30 min
      await new Promise(r => setTimeout(r, 3000));
      elapsed += 3;

      const resp = await fetch(`/jobs/${jobId}`, { headers });
      const data = await resp.json();

      if (data.status === 'done')    return data.result;
      if (data.status === 'failed')  throw new Error(data.error || 'Processing failed');

      const mins = Math.floor(elapsed / 60), secs = elapsed % 60;
      document.getElementById('loadingMsg').textContent =
        `Analyzing EEG signal… ${mins}m ${secs}s elapsed (large files can take 15-20 min)`;
    }
    throw new Error('Timed out waiting for result (>30 min).');
  }

  function renderResults(data) {
    const m = data.metrics;

    // Score
    const score = Math.round(m.sleep_quality_score);
    const scoreEl = document.getElementById('scoreVal');
    scoreEl.textContent = score;
    scoreEl.className = 'score ' + (score >= 75 ? 'score-great' : score >= 55 ? 'score-good' : score >= 35 ? 'score-fair' : 'score-poor');

    // Metrics cards
    const metrics = [
      { label: 'Recording',      value: m.recording_minutes.toFixed(0),      unit: 'min' },
      { label: 'Total Sleep',    value: m.tst_min.toFixed(0),                unit: 'min' },
      { label: 'Sleep Latency',  value: m.sleep_latency_min.toFixed(1),      unit: 'min' },
      { label: 'Efficiency',     value: (m.sleep_efficiency * 100).toFixed(1), unit: '%' },
      { label: 'WASO',           value: m.waso_min.toFixed(0),               unit: 'min' },
      { label: 'N3 (Deep)',      value: (m.pct_n3 * 100).toFixed(1),         unit: '%' },
      { label: 'REM',            value: (m.pct_rem * 100).toFixed(1),        unit: '%' },
      { label: 'Fragmentation',  value: (m.fragmentation_index * 100).toFixed(1), unit: '%' },
      { label: 'Avg Confidence', value: (m.confidence_mean * 100).toFixed(0),unit: '%' },
    ];

    document.getElementById('metricsGrid').innerHTML = metrics.map(x => `
      <div class="metric-card">
        <div class="m-label">${x.label}</div>
        <div class="m-value">${x.value} <span class="m-unit">${x.unit}</span></div>
      </div>
    `).join('');

    // Hypnogram
    renderHypnogram(data.epochs);

    document.getElementById('results').style.display = 'block';
  }

  async function fetchExplanation(metrics) {
    const apiKey = document.getElementById('apiKeyInput').value.trim();
    const lang = document.getElementById('langInput').value;
    const headers = { 'Content-Type': 'application/json', ...(apiKey ? { 'X-API-Key': apiKey } : {}) };

    try {
      const resp = await fetch('/explain', {
        method: 'POST',
        headers,
        body: JSON.stringify({ metrics, language: lang }),
      });
      if (!resp.ok) throw new Error('explain failed');
      const data = await resp.json();
      renderExplanation(data);
    } catch {
      document.getElementById('explainBody').innerHTML =
        '<p style="color:#64748b;font-size:0.88rem">AI analysis unavailable.</p>';
    }
  }

  function renderExplanation(data) {
    const badge = document.getElementById('explainBadge');
    badge.textContent = data.ai_available ? 'Claude AI' : 'Rule-based';
    badge.style.background = data.ai_available ? '#7c3aed22' : '#1e293b';
    badge.style.color = data.ai_available ? '#a78bfa' : '#64748b';

    const tips = data.tips.map(t => `<li>${t}</li>`).join('');
    document.getElementById('explainBody').innerHTML = `
      <p class="explain-text">${data.explanation}</p>
      <ul class="tips-list">${tips}</ul>
    `;
  }

  function renderHypnogram(epochs) {
    const labels = epochs.map(e => {
      const mins = Math.round(e.epoch * 30 / 60);
      return mins % 30 === 0 ? `${mins}m` : '';
    });

    const stageData = epochs.map(e => e.stage_id);
    const colors = epochs.map(e => STAGE_COLORS[e.stage_id]);

    if (hypnoChart) hypnoChart.destroy();

    const ctx = document.getElementById('hypnoChart').getContext('2d');
    hypnoChart = new Chart(ctx, {
      type: 'bar',
      data: {
        labels,
        datasets: [{
          data: stageData.map(() => 1),
          backgroundColor: colors,
          borderWidth: 0,
          barPercentage: 1.0,
          categoryPercentage: 1.0,
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: { display: false },
          tooltip: {
            callbacks: {
              title: (items) => `Epoch ${epochs[items[0].dataIndex].epoch} (${Math.round(epochs[items[0].dataIndex].epoch * 30 / 60)} min)`,
              label: (item) => {
                const e = epochs[item.dataIndex];
                return `Stage: ${STAGE_LABELS[e.stage_id]}  |  Confidence: ${(e.confidence * 100).toFixed(0)}%`;
              }
            }
          }
        },
        scales: {
          x: {
            ticks: { color: '#64748b', font: { size: 11 }, maxRotation: 0 },
            grid: { display: false },
          },
          y: {
            min: -0.5, max: 4.5,
            ticks: {
              color: '#94a3b8',
              font: { size: 11 },
              stepSize: 1,
              callback: v => STAGE_LABELS[v] ?? '',
            },
            grid: { color: '#1e2433' },
          }
        }
      }
    });
  }
</script>
</body>
</html>
